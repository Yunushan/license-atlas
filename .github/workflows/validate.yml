name: Validate catalog

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate source data
        run: python scripts/validate.py
      - name: Check repository invariants
        run: python scripts/check_repository.py
      - name: Verify generated documentation
        run: python scripts/generate_catalog.py --check
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
